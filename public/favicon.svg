<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ink field -->
  <rect width="32" height="32" fill="#07070a"/>
  <!-- Rule border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#3a2e1c" stroke-width="1"/>
  <!-- Corner brackets — top-left -->
  <polyline points="2,7 2,2 7,2" fill="none" stroke="#9bb0c0" stroke-width="1.2" stroke-linecap="square"/>
  <!-- top-right -->
  <polyline points="25,2 30,2 30,7" fill="none" stroke="#9bb0c0" stroke-width="1.2" stroke-linecap="square"/>
  <!-- bottom-left -->
  <polyline points="2,25 2,30 7,30" fill="none" stroke="#9bb0c0" stroke-width="1.2" stroke-linecap="square"/>
  <!-- bottom-right -->
  <polyline points="25,30 30,30 30,25" fill="none" stroke="#9bb0c0" stroke-width="1.2" stroke-linecap="square"/>
  <!-- Serif L — paper-bright -->
  <text x="16" y="23" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" fill="#ede1c6" text-anchor="middle" letter-spacing="-0.5">L</text>
</svg>
