        - heading "Family and Community" [level=2] [ref=e48]
        - paragraph [ref=e49]: Family is essential to me, and I'm blessed to have three incredible children and four delightful grandchildren who always amaze me with their boundless energy and zest for life. I'm also fortunate to share my life with my wonderful girlfriend and her three amazing kids, and being part of a blended family has added another deeply meaningful and joyful dimension to my life.
        - paragraph [ref=e50]: I hail from South Bend, Indiana, a vibrant and dynamic city known for its rich history, strong sense of community, and diverse cultural offerings. I take pride in my roots and cherish the memories and experiences shaped by growing up in this beautiful and welcoming place.
