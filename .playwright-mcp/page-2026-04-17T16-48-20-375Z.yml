          - paragraph [ref=e36]: An accomplished IT professional and passionate problem solver with a strong affinity for technology, exploring AI, and building innovative solutions.
      - generic [ref=e37]:
        - heading "My Journey into Technology" [level=2] [ref=e38]
        - paragraph [ref=e39]: For over 20 years, I've been delivering exceptional service within the IT industry, driven by my insatiable curiosity and commitment to innovation. I've always been captivated by the transformative power of technology—its ability to solve complex problems and open new doors of opportunity.
        - paragraph [ref=e40]:
          - text: Currently, I hold the position of AI Quality Analyst at
          - link "Aunalytics" [ref=e41] [cursor=pointer]:
            - /url: https://aunalytics.com/
          - text: ", an AI-powered data platform company based in the Midwest. My role focuses on evaluating and ensuring the quality of AI systems, combining my deep technical background with a keen eye for how AI performs in real-world scenarios."
        - heading "Beyond the Professional Realm" [level=2] [ref=e42]
        - paragraph [ref=e43]: When I'm not immersed in IT, I delve into various activities that fuel my curiosity and passion. I've been using the Linux operating system daily for over 19 years, reveling in the challenges of a terminal environment. I also explore the fascinating world of cryptocurrency, primarily focusing on $XRP and $XLM, and enjoy tinkering with AI tools for generating unique and intriguing projects.
        - paragraph [ref=e44]: Outside of technology, I delight in exploring the rich flavors of craft beers - mainly double IPAs and robust stouts. As a self-proclaimed hot-wing connoisseur, I constantly search for the perfect spicy bite. My fondness for the Star Wars universe often occupies my free time as I eagerly discuss and dissect every detail of the franchise.
        - generic [ref=e45]:
